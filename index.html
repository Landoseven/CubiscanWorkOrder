<!DOCTYPE html>
<html>
<head>
  <title>Work Order Form</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="pdfContent">
    <!-- Header -->
    <header>
      <div class="content">
        <a href="#" class="logo">
          <img src="Logo/Cubiscan WHT_HRZT.png" alt="Cubiscan Logo">
        </a>
        <div class="title"></div>
      </div>
    </header>
    
    <!--Work Order Form-->
    <div id="myForm">
      <form class="form1">
        <!-- Top Row -->
        <div class="form-row">
          <div class="form-col">
            <label for="technician">Technician</label>
            <input type="text" id="technician" name="technician">
            
            <label for="date">Date</label>
            <input type="date" id="date" name="date">
            
            <label for="timeOnsite">Time Onsite</label>
            <input type="text" id="timeOnsite" name="timeOnsite">
          </div>
          
          <div class="form-col">
            <label for="customerSite">Customer Site</label>
            <input type="text" id="customerSite" name="customerSite">
            
            <label for="textAreaSerial">Serial Number</label>
            <div contenteditable="true" id="textAreaSerial" name="serial number"></div>
            
            <label for="SRO">SRO/SO</label>
            <input type="text" id="SRO" name="SRO">
          </div>
          
          <div class="form-col">
            <label for="cubiscanmodel">Cubiscan Model</label>
            <select id="cubiscanmodel" name="cubiscan model">
              <option value="Select">Select</option>
              <option value="Multiple">Multiple</option>
              <option value="CS325">CS325</option>
              <option value="CS325_V2">CS325 V2</option>
              <option value="CS25">CS25</option>
              <option value="CS125">CS125</option>
              <option value="CS100">CS100</option>
              <option value="CS110">CS110</option>
              <option value="CS150">CS150</option>
              <option value="CS75">CS75</option>
              <option value="CS75PRO">CS75 PRO</option>
              <option value="CS200-TS">CS200-TS</option>
              <option value="CS200-SQ">CS200-SQ</option>
              <option value="CS200-B">CS200-B</option>
              <option value="CS210-L">CS210</option>
              <option value="CS225">CS225</option>
              <option value="CS75 Pro Slam">CS75 Pro Slam</option>
              <option value="CS1200">CS1200</option>
              <option value="CS1200 FM">CS1200 FM</option>
              <option value="CS1200 IM">CS1200 IM</option>
              <option value="CS1100">CS1100</option>
              <option value="Contour Pro">Contour Pro</option>
              <option value="FreightWeigh 150">FreightWeigh 150</option>
              <option value="S9">S9</option>
            </select>
            
            <label for="serviceperformed">Service Performed</label>
            <select id="serviceperformed" name="service performed">
              <option value="Select">Select</option>
              <option value="Installation">Installation</option>
              <option value="Service">Service</option>
              <option value="Maintenance/CCA">Maintenance/CCA</option>
              <option value="Service/Maintenance">Service/Maintenance</option>
            </select>
            <label for="postcheck">Post-check Technician</label>
            <input type="text" id="postcheck" name="postcheck">
          </div>
        </div>
        
        <!-- Maintenance Tables -->
        <div id="maintenanceContainer" style="display: none;">
          <!-- CS25/CS125/CS325 Maintenance Table -->
          <div id="maintenanceCS25" class="maintenance-table">
            <div class="maintenance-table-cell">
              <input type="checkbox" id="dataTransfer25">
              <label for="dataTransfer25">Checked data transfer</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="weightCalibrated25">
              <label for="weightCalibrated25">Weight calibrated</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="gateCalibrated25">
              <label for="gateCalibrated25">Gate calibrated</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cableConnections25">
              <label for="cableConnections25">Checked cable connections</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cleanedGlass25">
              <label for="cleanedGlass25">Cleaned glass and gate</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cubiscanLevel25">
              <label for="cubiscanLevel25">Checked cubiscan level</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="ribbonCable25">
              <label for="ribbonCable25">Checked ribbon cable</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="encoder25">
              <label for="encoder25">Checked encoder</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="accessories25">
              <label for="accessories25">Verified functionality of accessories</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="firmware25">
              <label for="firmware25">Checked/Updated firmware</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="functional25">
              <label for="functional25">Cubiscan tested and fully fuctional</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="training25">
              <label for="training25">Provided training</label>
            </div>
          </div>
          
          <!-- CS100/CS110/CS150 Maintenance Table -->
          <div id="maintenanceCS100" class="maintenance-table">
            <div class="maintenance-table-cell">
              <input type="checkbox" id="dataTransfer100">
              <label for="dataTransfer100">Checked data transfer</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="weightCalibrated100">
              <label for="weightCalibrated100">Weight calibrated</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="sensorsCalibrated100">
              <label for="sensorsCalibrated100">Sensors calibrated</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cableConnections100">
              <label for="cableConnections100">Checked cable connections</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cleanedPlatform100">
              <label for="cleanedPlatform100">Cleaned scale platform</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="cubiscanLevel100">
              <label for="cubiscanLevel100">Checked Cubiscan level</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="accessories100">
              <label for="accessories100">Verified functionality of accessories</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="firmware100">
              <label for="firmware100">Checked/Updated Firmware</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="functional100">
              <label for="functional100">Cubiscan tested and fully fuctional</label>
            </div>
            <div class="maintenance-table-cell">
              <input type="checkbox" id="training100">
              <label for="training100">Provided training</label>
            </div>
          </div>
          
          <!-- Other maintenance tables would be added here -->
        </div>
        
        <!-- Parts Section -->
        <div class="parts-section">
  <div class="parts-controls-row">
    <div class="parts-col">
      <label for="partsDropdown">Parts</label>
      <div class="parts-input-group">
        <select id="partsDropdown" class="parts-dropdown">
          <option value="Select">Select</option>
          <!-- Parts options will be populated by JavaScript -->
        </select>
        
        <select id="quantityDropdown" class="qty-dropdown">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      
      <button id="addPartButton" type="button">Add</button>
    </div>
    
    <div class="parts-col">
      <label for="partsReturnDropdown">Parts Returned (Method)</label>
      <select id="partsReturnDropdown">
        <option value="N/A">N/A</option>
        <option value="Carried with Tech">Carried with Tech</option>
        <option value="FedEx Drop Off">FedEx Drop Off</option>
      </select>
    </div>
  </div>
  
  <label for="textAreaParts">Parts Used</label>
  <div contenteditable="true" id="textAreaParts" name="parts"></div>
</div>
        
        <!-- Notes -->
        <label for="textAreaNotes">Notes</label>
        <div contenteditable="true" id="textAreaNotes" name="notes"></div>
        
        <!-- Site Rep Info -->
        <div class="site-rep-row">
          <div class="site-rep-col">
            <label for="siteRepresentative">Site Representative</label>
            <input type="text" id="siteRepresentative" name="site representative">
          </div>
          
          <div class="site-rep-col">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
          </div>
          
          <div class="site-rep-col">
            <label for="phone">Phone #</label>
            <input type="tel" id="phone" name="phone">
          </div>
        </div>
        
        <!-- Signature -->
        <label for="signature-pad">Signature</label>
        <canvas id="signature-pad"></canvas>
      </form>
      
      <!-- Buttons -->
      <div class="button-row">
        <button id="generate">Download PDF</button>
        <button id="formClear">Clear Form</button>
      </div>
    </div>
  </div>
  
  <script src="Logic.js"></script>
</body>
</html>
